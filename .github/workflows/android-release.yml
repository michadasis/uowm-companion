name: Android release

# Builds the APK signed with the release key & publishes it on a GitHub
# Release. Runs when a version tag is pushed (v1.0.0), or by hand for a tag
# that already exists. Every release must be signed with the same key, so a
# phone takes it as an update; the key lives only in the repo's secrets.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: The version tag to build & publish, e.g. v1.0.0
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Check the tag matches the app's version
        working-directory: mobile
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [ "v$VERSION" != "$TAG" ]; then
            echo "Tag $TAG does not match the app's version $VERSION" >&2
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install JS dependencies
        working-directory: mobile
        run: npm ci

      - name: Install the Android NDK, CMake, platform & build tools
        run: |
          SDK="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDK" --licenses > /dev/null 2>&1 || true
          "$SDK" "ndk;27.1.12297006" "cmake;3.22.1" "platforms;android-36" "build-tools;36.0.0"

      - name: Generate the native Android project
        working-directory: mobile
        run: npx expo prebuild --platform android --no-install

      - name: Sign release builds with the release key
        working-directory: mobile/android
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "The ANDROID_KEYSTORE_BASE64 secret is not set" >&2
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > app/release.keystore
          # A second android block is merged over the generated one; its
          # release build type takes the release key instead of the debug one.
          cat >> app/build.gradle <<'GRADLE'

          android {
              signingConfigs {
                  releaseKey {
                      storeFile file('release.keystore')
                      storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
                      keyAlias System.getenv('ANDROID_KEY_ALIAS')
                      keyPassword System.getenv('ANDROID_KEY_PASSWORD')
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.releaseKey
                  }
              }
          }
          GRADLE

      - name: Build the release APK
        working-directory: mobile/android
        env:
          EXPO_PUBLIC_API_URL: ${{ vars.EXPO_PUBLIC_API_URL }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Check the APK is signed with the release key, not the debug one
        run: |
          APK=mobile/android/app/build/outputs/apk/release/app-release.apk
          SIGNER=$("$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$APK")
          echo "$SIGNER" | grep "certificate DN"
          if echo "$SIGNER" | grep -q "CN=Android Debug"; then
            echo "The APK is signed with the debug key" >&2
            exit 1
          fi
          cp "$APK" "uowm-companion-${TAG#v}.apk"

      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK="uowm-companion-${TAG#v}.apk"
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --clobber
          else
            gh release create "$TAG" "$APK" --title "UoWM Companion ${TAG#v}" --generate-notes
          fi
